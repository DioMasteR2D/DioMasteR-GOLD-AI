name: EMA strategy tests

on:
  push:
    branches:
      - "**"
    paths:
      - "cloud_bridge/**"
      - ".github/workflows/ema-strategy-tests.yml"
  pull_request:
    paths:
      - "cloud_bridge/**"
      - ".github/workflows/ema-strategy-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cloud_bridge/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run EMA strategy tests
        run: python -m pytest -q tests
