name: Check MT5 bridge
on:
  push:
    branches: [main]
    paths: ['bridge/**', '.github/workflows/bridge-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bridge syntax
        run: python -m py_compile bridge/bridge.py
