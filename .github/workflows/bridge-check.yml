name: TickerAll EMA cloud checks
on:
  push:
    branches: [main, strategy/ema-9-21-h1-mtf-demo]
    paths:
      - 'cloud_bridge/**'
      - '.github/workflows/bridge-check.yml'
  pull_request:
    paths:
      - 'cloud_bridge/**'
      - '.github/workflows/bridge-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud strategy dependencies
        run: python -m pip install -r cloud_bridge/requirements.txt
      - name: Compile cloud bridge
        run: python -m compileall -q cloud_bridge
      - name: Run EMA strategy tests
        run: cd cloud_bridge && python -m pytest -q tests
