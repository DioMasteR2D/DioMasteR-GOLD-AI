services:
  - type: web
    name: diomaster-gold-ai-cloud-bridge
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: cloud_bridge
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TICKERALL_API_KEY
        sync: false
      - key: TICKERALL_API_BASE
        value: https://api.tickerall.com
      - key: TICKERALL_ACCOUNT_ID
        sync: false
      - key: TICKERALL_SERVER
        sync: false
      - key: TICKERALL_BROKER_LOGIN
        sync: false
      - key: TICKERALL_BROKER_PASSWORD
        sync: false
      - key: DIO_BRIDGE_TOKEN
        generateValue: true
      - key: DIO_MT5_ALLOWED_SYMBOLS
        value: XAUUSD
      - key: DIO_MT5_MAX_VOLUME
        value: "0.01"
      - key: DIO_MT5_MAX_RISK_FRACTION
        value: "0.0025"
      - key: DIO_MT5_MAX_POSITIONS
        value: "10"
      - key: DIO_MT5_DEMO_EXECUTION_ENABLED
        value: "false"
